<input
    #searchBox
    type="text"
    placeholder="Search Course">

<button
    (click)="updateSearch(searchBox.value)">
    Search
</button>

<hr><h2>Course List</h2>
<h3>Total Courses: {{ courseCount }}</h3>
<p *ngIf="isLoading">
    Loading courses...
</p>

<div
    *ngFor="let course of courses"
    (click)="viewCourse(course.id)"
    style="cursor:pointer; margin-bottom:15px;">

    <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
    </app-course-card>

</div>

<ng-template #noCourses>

    <p>No courses available.</p>

</ng-template>

<p *ngIf="selectedCourseId">

    Selected Course ID :

    {{selectedCourseId}}

</p>
