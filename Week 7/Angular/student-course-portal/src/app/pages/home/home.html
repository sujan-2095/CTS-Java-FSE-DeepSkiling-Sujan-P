<h1>{{ portalName }}</h1>

<p>
  Manage your courses, enrollments, grades and profile using this portal.
</p>

<button
    (click)="onEnrollClick()"
    [disabled]="!isPortalActive">
    Enroll Now
</button>

<p>{{ message }}</p>

<br>

<input
    type="text"
    placeholder="Search Course"
    [(ngModel)]="searchTerm">

<p>
    Searching for: {{ searchTerm }}
</p>

<hr>

<div class="stats">

    <div class="card">
        <h2>{{ availableCourses }}</h2>
        <p>Courses Available</p>
    </div>

    <div class="card">
        <h2>3</h2>
        <p>Enrolled</p>
    </div>

    <div class="card">
        <h2>3.8</h2>
        <p>GPA</p>
    </div>

</div>
